name: site
# Only rebuild when something Nicolino reads changes (allow-list).
# Keep this list in sync between push and pull_request.
on:
  push:
    branches: [main]
    paths: &site_paths
      - "content/**"
      - "assets/**"
      - "themes/**"
      - "shortcodes/**"
      - "templates/**"
      - "user_templates/**"
      - "conf.yml"
      - "conf.*.yml"
      - ".nicolino-version"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *site_paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nicolino (pinned in .nicolino-version)
        run: |
          VER=$(cat .nicolino-version)
          sudo curl -fsSL -o /usr/local/bin/nicolino \
            "https://github.com/ralsina/nicolino/releases/download/${VER}/nicolino-static-linux-amd64"
          sudo chmod +x /usr/local/bin/nicolino
          nicolino --version

      - name: Build
        run: nicolino build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
