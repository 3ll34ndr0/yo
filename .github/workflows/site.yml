name: site
on:
  push:
    branches: [main]
    paths-ignore: ["dns/**", ".github/workflows/dns.yml", "README.md"]
  pull_request:
    paths-ignore: ["dns/**", ".github/workflows/dns.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nicolino (pinned in .nicolino-version)
        run: |
          VER=$(cat .nicolino-version)
          sudo curl -fsSL -o /usr/local/bin/nicolino \
            "https://github.com/ralsina/nicolino/releases/download/${VER}/nicolino-static-linux-amd64"
          sudo chmod +x /usr/local/bin/nicolino
          nicolino --version

      - name: Build
        run: nicolino build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
